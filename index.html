<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply via HCLTech Referral</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f5f5f5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
  .card { background:white; border-radius:16px; padding:2.5rem; max-width:500px; width:100%; box-shadow:0 4px 24px rgba(0,0,0,0.08); }
  .logo { color:#6B21A8; font-weight:800; font-size:1.1rem; margin-bottom:1.5rem; }
  h1 { font-size:1.5rem; color:#1a1a2e; margin-bottom:0.5rem; }
  .badge { background:#f3e8ff; color:#6B21A8; padding:4px 12px; border-radius:20px; font-size:0.8rem; display:inline-block; margin-bottom:1.5rem; }
  .field { margin-bottom:1rem; }
  label { display:block; font-size:0.85rem; font-weight:500; color:#444; margin-bottom:4px; }
  .req { color:red; }
  input, select { width:100%; padding:10px 12px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:0.9rem; outline:none; }
  input:focus { border-color:#6B21A8; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .upload-area { border:2px dashed #d1d5db; border-radius:10px; padding:1.5rem; text-align:center; cursor:pointer; position:relative; }
  .upload-area input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-area p { color:#888; font-size:0.85rem; }
  .file-name { color:#16a34a; font-size:0.85rem; margin-top:8px; display:none; }
  .btn { width:100%; padding:13px; background:#6B21A8; color:white; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:1.5rem; }
  .btn:hover { background:#7c3aed; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .error { color:red; font-size:0.82rem; margin-top:8px; display:none; padding:8px; background:#fef2f2; border-radius:6px; }
  .success { display:none; text-align:center; padding:2rem 0; }
  .success h2 { color:#1a1a2e; margin-bottom:0.5rem; }
  .success p { color:#666; font-size:0.9rem; }
</style>
</head>
<body>
<div class="card" id="formCard">
  <div class="logo">⚡ HCLTech Referral Portal</div>
  <h1>Apply via Employee Referral</h1>
  <div class="badge" id="jobBadge">Loading...</div>

  <div class="row">
    <div class="field"><label>First Name <span class="req">*</span></label><input id="firstName" placeholder="Rahul"></div>
    <div class="field"><label>Last Name <span class="req">*</span></label><input id="lastName" placeholder="Sharma"></div>
  </div>
  <div class="field"><label>Email <span class="req">*</span></label><input type="email" id="email" placeholder="rahul@example.com"></div>
  <div class="row">
    <div class="field"><label>Phone</label><input id="phone" placeholder="+91 98765 43210"></div>
    <div class="field"><label>Experience (years) <span class="req">*</span></label><input id="exp" placeholder="5"></div>
  </div>
  <div class="row">
    <div class="field"><label>Current Company</label><input id="company" placeholder="TCS"></div>
    <div class="field"><label>Current CTC (LPA)</label><input id="ctc" placeholder="12"></div>
  </div>
  <div class="row">
    <div class="field"><label>Expected CTC (LPA)</label><input id="ectc" placeholder="16"></div>
    <div class="field"><label>Notice Period</label><input id="notice" placeholder="30 days"></div>
  </div>
  <div class="field"><label>LinkedIn URL</label><input id="linkedin" placeholder="linkedin.com/in/yourname"></div>
  <div class="field">
    <label>Resume <span class="req">*</span></label>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">
      <p>📄 Click or drag to upload resume</p>
      <p style="font-size:0.75rem;color:#bbb">PDF, DOC, DOCX · Max 5MB</p>
    </div>
    <div class="file-name" id="fileName"></div>
  </div>

  <div class="error" id="errMsg"></div>
  <button class="btn" id="submitBtn" onclick="submitForm()">Submit Application →</button>
</div>

<div class="card success" id="successCard">
  <div style="font-size:3rem;margin-bottom:1rem">🎉</div>
  <h2>Application Received!</h2>
  <p>We'll review your profile within 3 working days.<br>Shortlisted candidates will be referred directly to HCLTech.</p>
</div>

<script>
  // Get params from URL
  const params = new URLSearchParams(location.search);
  const jobTitle = decodeURIComponent(params.get('job') || 'Open Position');
  const jobId = params.get('id') || '';
  const scriptUrl = params.get('script') || '';

  document.getElementById('jobBadge').textContent = jobTitle;
  document.title = 'Apply — ' + jobTitle;

  // File upload UI
  const fileInput = document.getElementById('resumeFile');
  fileInput.onchange = () => {
    if (fileInput.files[0]) {
      document.getElementById('fileName').textContent = '✅ ' + fileInput.files[0].name;
      document.getElementById('fileName').style.display = 'block';
    }
  };

  function showErr(msg) {
    const el = document.getElementById('errMsg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
  }

  function getVal(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  async function submitForm() {
    // Validate
    if (!getVal('firstName')) return showErr('First name is required');
    if (!getVal('lastName')) return showErr('Last name is required');
    if (!getVal('email') || !getVal('email').includes('@')) return showErr('Valid email required');
    if (!getVal('exp')) return showErr('Experience is required');
    if (!fileInput.files[0]) return showErr('Please upload your resume');
    if (fileInput.files[0].size > 5 * 1024 * 1024) return showErr('File too large — max 5MB');
    if (!scriptUrl) return showErr('Script URL missing from link');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      // Convert file to base64
      const fileData = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(fileInput.files[0]);
      });

      const payload = {
        jobTitle: jobTitle,
        jobId: jobId,
        firstName: getVal('firstName'),
        lastName: getVal('lastName'),
        email: getVal('email'),
        phone: getVal('phone'),
        experience: getVal('exp'),
        company: getVal('company'),
        ctc: getVal('ctc'),
        expectedCtc: getVal('ectc'),
        notice: getVal('notice'),
        linkedin: getVal('linkedin'),
        country: 'India',
        fileName: fileInput.files[0].name,
        fileType: fileInput.files[0].type,
        fileData: fileData,
        submittedAt: new Date().toISOString()
      };

      // Send to Google Apps Script
      // Using fetch with no-cors - response is opaque but request goes through
      await fetch(scriptUrl, {
        method: 'POST',
        body: JSON.stringify(payload),
        mode: 'no-cors'
      });

      // Show success
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';

    } catch(err) {
      showErr('Error: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Submit Application →';
    }
  }
</script>
</body>
</html>
